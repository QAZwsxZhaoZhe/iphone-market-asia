[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-market-asia"
version = "0.2.0"
description = "Hong Kong used iPhone market aggregation platform."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "opensearch-py>=2.7,<3",
    "playwright>=1.50",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "PyJWT[crypto]>=2.9,<3",
    "redis>=5,<7",
    "requests>=2.31",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
iphone-market = "iphone_market.cli:main"
iphone-platform = "iphone_market.platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["iphone_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
